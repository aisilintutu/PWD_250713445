<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <title>Formulir Pendaftaran Organisasi</title>
        <link rel="stylesheet" type="text/css" href="style.css" />
    </head>
    <body>

        <div class="form-container">
            <h1>Pendaftaran Anggota Organisasi</h1>
            <h3>Silakan lengkapi formulir pendaftaran di bawah ini dengan data diri Anda.</h3>

            <form action="#" method="post">
                <fieldset>
                    <legend>Data Pribadi</legend>
                    
                    <div class="form-group">
                        <label for="nama">Nama Lengkap:</label>
                        <input type="text" id="nama" name="nama" />
                    </div>

                    <div class="form-group">
                        <label for="nim">Nomor Induk Mahasiswa (NIM):</label>
                        <input type="text" id="nim" name="nim" />
                    </div>

                    <div class="form-group">
                        <label>Jenis Kelamin:</label>
                        <div class="radio-group">
                            <input type="radio" id="laku" name="gender" value="Laki-laki" />
                            <label for="laku" class="radio-label">Laki-laki</label>
                            
                            <input type="radio" id="perempuan" name="gender" value="Perempuan" />
                            <label for="perempuan" class="radio-label">Perempuan</label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="hp">Nomor Ponsel:</label>
                        <input type="text" id="hp" name="hp" />
                    </div>

                    <div class="form-group">
                        <label for="semester">Semester:</label>
                        <select id="semester" name="semester">
                            <option value="">-- Pilih Semester --</option>
                            <option value="1">Semester 1</option>
                            <option value="2">Semester 2</option>
                            <option value="3">Semester 3</option>
                            <option value="4">Semester 4</option>
                            <option value="5">Semester 5</option>
                            <option value="6">Semester 6</option>
                            <option value="7">Semester 7</option>


                        </select>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Minat &amp; Keterampilan</legend>
                    
                    <div class="form-group">
                        <label>Minat atau Bidang yang Diingini:</label>
                        <div class="checkbox-group">
                            <input type="checkbox" id="bidang_acara" name="bidang[]" value="Acara" />
                            <label for="bidang_acara" class="check-label">Bidang Acara</label><br />

                            <input type="checkbox" id="bidang_humas" name="bidang[]" value="Humas" />
                            <label for="bidang_humas" class="check-label">Humas</label><br />

                            <input type="checkbox" id="bidang_media" name="bidang[]" value="Media" />
                            <label for="bidang_media" class="check-label">Media</label><br />

                            <input type="checkbox" id="bidang_kreatif" name="bidang[]" value="Kreatif" />
                            <label for="bidang_kreatif" class="check-label">Kreatif</label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="keterampilan">Keterampilan yang Dimiliki:</label><br />
                        <textarea id="keterampilan" name="keterampilan" rows="3" cols="40" placeholder="Contoh: Desain grafis, public speaking, editing video, dll."></textarea>
                    </div>

                </fieldset>

                <div class="form-group">
                    <input type="submit" value="Kirim Pendaftaran" class="btn-submit" />
                </div>
            </form>
        </div>

    </body>
</html>
